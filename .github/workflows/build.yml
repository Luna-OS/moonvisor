name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build app and disk image
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-${GITHUB_SHA::7}"
          fi
          VERSION="$VERSION" BUILD_NUMBER="$GITHUB_RUN_NUMBER" bash scripts/build-app.sh --dmg

      - uses: actions/upload-artifact@v4
        with:
          name: Moonvisor
          path: build/*.dmg

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/*.dmg --title "Moonvisor $GITHUB_REF_NAME" --generate-notes
